# Tool configuration only (this is not an installable package).

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear, pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    # FastAPI's `db: Session = Depends(get_db)` is a call in a default
    # argument by design.
    "B008",
    # `raise HTTPException(...)` inside `except` is intentional; the
    # original DB error isn't useful to API clients.
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations keep Alembic's one-line-per-op style.
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette 1.x suggests the httpx2 fork for TestClient; plain httpx
    # still works fine and is what the app itself uses.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
